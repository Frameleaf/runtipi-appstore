name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOLLOW_LATEST: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Images follow :latest; a new Frameleaf release bumps tipi_version so Runtipi offers the update.
      - name: Follow the latest Frameleaf release
        if: env.FOLLOW_LATEST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view -R Frameleaf/frameleaf-app --json tagName -q .tagName | sed 's/^frameleaf-v//')
          current=$(jq -r .version apps/frameleaf/config.json)
          if [ "$latest" != "$current" ]; then bun ./scripts/update-config.ts apps/frameleaf/docker-compose.json "$latest"; fi

      - name: Run tests
        run: bun test

      - name: Start Frameleaf from the app definition
        run: |
          FRAMELEAF_DB_PASSWORD="ci-$(openssl rand -hex 16)"
          export FRAMELEAF_DB_PASSWORD APP_DATA_DIR="$RUNNER_TEMP/app" ROOT_FOLDER_HOST="$RUNNER_TEMP/root"
          node scripts/smoke-compose.mjs apps/frameleaf/docker-compose.json 8283 > "$RUNNER_TEMP/compose.json"
          docker compose -p frameleaf -f "$RUNNER_TEMP/compose.json" up -d --quiet-pull
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8283/api/server/ping; then echo; break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8283/api/server/version
          echo
          docker compose -p frameleaf -f "$RUNNER_TEMP/compose.json" ps
          docker compose -p frameleaf -f "$RUNNER_TEMP/compose.json" exec -T frameleaf-server \
            node -e "fetch('http://frameleaf-machine-learning:3003/ping').then(r => r.text()).then(t => { console.log('machine learning:', t); if (t.trim() !== 'pong') process.exit(1) })"

      - name: Logs
        if: failure()
        run: docker compose -p frameleaf -f "$RUNNER_TEMP/compose.json" logs --tail 200

      - name: Commit the update
        if: env.FOLLOW_LATEST == 'true'
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Update Frameleaf to $(jq -r .version apps/frameleaf/config.json)"
          git push origin HEAD:refs/heads/main
